[project]
name = "portfolio-risk-service-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
  "scenario(业务场景名称): 标记用例所属业务场景，便于日志体现覆盖情况",
]
testpaths = ["tests"]
log_cli = false
